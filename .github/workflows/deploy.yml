name: CI/CD — Test, Build & Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target:
        description: 'Cel wdrożenia'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - oci
          - gcp
      gcp_if_stopped:
        description: 'GCP: zachowanie gdy VM jest zatrzymana'
        required: false
        default: 'start-and-stop'
        type: choice
        options:
          - start-and-stop
          - skip

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-and-build:
    name: Test & Build
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cyber_quiz
          POSTGRES_USER: cyber_quiz
          POSTGRES_PASSWORD: cyber_quiz_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cyber_quiz -d cyber_quiz"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Check JS & shell scripts syntax
        run: |
          node --check server/index.js
          node --check scripts/smoke-test.mjs
          node --check scripts/load-test.mjs
          bash -n scripts/deploy.sh deploy/gcp/*.sh

      - name: Build frontend bundle (Vite)
        working-directory: client
        run: npm run build

      - name: Verify frontend build output
        run: test -f client/dist/index.html

      - name: Run automated smoke & E2E tests
        env:
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGDATABASE: cyber_quiz
          PGUSER: cyber_quiz
          PGPASSWORD: cyber_quiz_ci_password
        run: node scripts/smoke-test.mjs

      - name: Build production Docker image
        run: docker build -t cyber-quiz:ci .

  deploy:
    name: Deploy to 21152115.xyz
    needs: test-and-build
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.target != 'gcp'))
    runs-on: ubuntu-latest

    steps:
      - name: Validate deployment secrets
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          missing=0
          for var in SSH_HOST SSH_USER SSH_PRIVATE_KEY; do
            if [ -z "${!var}" ]; then
              echo "::error::Brak wymaganego sekretu GitHub Actions: $var"
              missing=1
            fi
          done
          exit $missing

      - name: Setup SSH configuration
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          PORT="${SSH_PORT:-22}"
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts
          fi
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy on remote server via SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
          SWAG_CONTAINER: ${{ vars.SWAG_CONTAINER }}
        run: |
          PORT="${SSH_PORT:-22}"
          ssh -i ~/.ssh/deploy_key \
              -p "$PORT" \
              -o StrictHostKeyChecking=yes \
              -o BatchMode=yes \
              -o ConnectTimeout=15 \
              "${SSH_USER}@${SSH_HOST}" \
              bash -s -- "${DEPLOY_DIR:-}" "${SWAG_CONTAINER:-swag}" <<'EOF'
          set -Eeuo pipefail
          TARGET_DIR="${1:-$HOME/containers/cyber-quiz}"
          TARGET_DIR="${TARGET_DIR/#\~/$HOME}"
          SWAG_NAME="${2:-swag}"

          cd "$TARGET_DIR"
          git fetch --prune origin main
          git checkout main
          git reset --hard origin/main
          DEPLOY_DIR="$TARGET_DIR" SWAG_CONTAINER="$SWAG_NAME" bash scripts/deploy.sh
          EOF

      - name: Cleanup SSH key
        if: always()
        run: rm -rf ~/.ssh/deploy_key

  deploy-gcp:
    name: Deploy to GCP
    needs: test-and-build
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.target != 'oci'))
    runs-on: ubuntu-latest

    steps:
      - name: Validate GCP deployment secrets
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
        run: |
          missing=0
          for var in GCP_SA_KEY GCP_PROJECT_ID; do
            if [ -z "${!var}" ]; then
              echo "::error::Brak wymaganego sekretu/zmiennej GitHub Actions: $var"
              missing=1
            fi
          done
          exit $missing

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Check VM state and start if stopped
        id: vm
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
          GCP_ZONE: ${{ vars.GCP_ZONE || secrets.GCP_ZONE || 'europe-central2-a' }}
          GCP_VM_NAME: ${{ vars.GCP_VM_NAME || secrets.GCP_VM_NAME || 'cyber-quiz-vm' }}
          IF_STOPPED: ${{ github.event.inputs.gcp_if_stopped || vars.GCP_DEPLOY_WHEN_STOPPED || 'start-and-stop' }}
        run: |
          set -Eeuo pipefail

          get_status() {
            gcloud compute instances describe "$GCP_VM_NAME" \
              --project="$GCP_PROJECT_ID" \
              --zone="$GCP_ZONE" \
              --format='get(status)'
          }

          STATUS="$(get_status)"
          echo "Aktualny stan VM ${GCP_VM_NAME} (${GCP_ZONE}): ${STATUS}"

          if [ "$STATUS" = "RUNNING" ]; then
            echo "started_by_ci=false" >> "$GITHUB_OUTPUT"
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$IF_STOPPED" = "skip" ]; then
            echo "::notice::VM ${GCP_VM_NAME} jest zatrzymana (${STATUS}) i tryb to 'skip' — pomijam deploy na GCP."
            echo "started_by_ci=false" >> "$GITHUB_OUTPUT"
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$STATUS" = "STOPPING" ]; then
            echo "VM jest w trakcie zatrzymywania — czekam na stan TERMINATED..."
            for _ in $(seq 1 24); do
              STATUS="$(get_status)"
              [ "$STATUS" = "TERMINATED" ] && break
              sleep 5
            done
          fi

          echo "Uruchamiam VM ${GCP_VM_NAME} na czas wdrożenia (zostanie automatycznie zatrzymana po zakończeniu)..."
          gcloud compute instances start "$GCP_VM_NAME" \
            --project="$GCP_PROJECT_ID" \
            --zone="$GCP_ZONE" \
            --quiet

          # Zapisz flagę od razu po starcie, aby krok 'Stop VM' zawsze ją wyłączył nawet przy błędzie SSH/deploy
          echo "started_by_ci=true" >> "$GITHUB_OUTPUT"
          echo "should_deploy=true" >> "$GITHUB_OUTPUT"

          echo "Oczekiwanie na gotowość SSH przez IAP..."
          for attempt in $(seq 1 24); do
            if gcloud compute ssh "$GCP_VM_NAME" \
              --project="$GCP_PROJECT_ID" \
              --zone="$GCP_ZONE" \
              --tunnel-through-iap \
              --quiet \
              --ssh-flag="-o BatchMode=yes" \
              --ssh-flag="-o ConnectTimeout=10" \
              --ssh-flag="-o StrictHostKeyChecking=accept-new" \
              --command="true" >/dev/null 2>&1; then
              echo "SSH przez IAP gotowe (próba ${attempt})."
              exit 0
            fi
            sleep 5
          done

          echo "::error::Timeout oczekiwania na SSH przez IAP dla VM ${GCP_VM_NAME}."
          exit 1

      - name: Deploy on GCP VM via IAP SSH
        if: steps.vm.outputs.should_deploy == 'true'
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
          GCP_ZONE: ${{ vars.GCP_ZONE || secrets.GCP_ZONE || 'europe-central2-a' }}
          GCP_VM_NAME: ${{ vars.GCP_VM_NAME || secrets.GCP_VM_NAME || 'cyber-quiz-vm' }}
          GCP_DEPLOY_DIR: ${{ vars.GCP_DEPLOY_DIR || '/opt/cyber-quiz' }}
        run: |
          set -Eeuo pipefail
          REMOTE_B64="$(base64 -w0 <<'EOF'
          set -Eeuo pipefail
          TARGET_DIR="$1"

          REPO_OWNER="$(stat -c '%U' "$TARGET_DIR")"
          if [ "$REPO_OWNER" != "root" ] && id "$REPO_OWNER" >/dev/null 2>&1; then
            sudo -u "$REPO_OWNER" -H git -C "$TARGET_DIR" fetch --prune origin main
            sudo -u "$REPO_OWNER" -H git -C "$TARGET_DIR" checkout main
            sudo -u "$REPO_OWNER" -H git -C "$TARGET_DIR" reset --hard origin/main
          else
            git -C "$TARGET_DIR" fetch --prune origin main
            git -C "$TARGET_DIR" checkout main
            git -C "$TARGET_DIR" reset --hard origin/main
          fi

          DEPLOY_DIR="$TARGET_DIR" bash "$TARGET_DIR/deploy/gcp/deploy.sh"
          EOF
          )"

          gcloud compute ssh "$GCP_VM_NAME" \
            --project="$GCP_PROJECT_ID" \
            --zone="$GCP_ZONE" \
            --tunnel-through-iap \
            --quiet \
            --ssh-flag="-o BatchMode=yes" \
            --ssh-flag="-o ConnectTimeout=15" \
            --ssh-flag="-o StrictHostKeyChecking=accept-new" \
            --command="printf '%s' '${REMOTE_B64}' | base64 -d | sudo bash -s -- '${GCP_DEPLOY_DIR}'"

      - name: Stop GCP VM if started by CI
        if: always() && steps.vm.outputs.started_by_ci == 'true'
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
          GCP_ZONE: ${{ vars.GCP_ZONE || secrets.GCP_ZONE || 'europe-central2-a' }}
          GCP_VM_NAME: ${{ vars.GCP_VM_NAME || secrets.GCP_VM_NAME || 'cyber-quiz-vm' }}
        run: |
          echo "Zatrzymuję VM ${GCP_VM_NAME} uruchomioną na potrzeby CI/CD..."
          gcloud compute instances stop "$GCP_VM_NAME" \
            --project="$GCP_PROJECT_ID" \
            --zone="$GCP_ZONE" \
            --quiet
          echo "VM ${GCP_VM_NAME} zatrzymana (koszt CPU i ephemeral IP = \$0)."
