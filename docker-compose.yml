services:
  redis:
    image: redis:7-alpine
    container_name: cyber_quiz_redis
    ports:
      - "6379:6379"
    command: redis-server --save "" --appendonly no --maxmemory 256mb --maxmemory-policy volatile-lru

  postgres:
    image: postgres:16-alpine
    container_name: cyber_quiz_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cyber_quiz}
      POSTGRES_USER: ${POSTGRES_USER:-cyber_quiz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cyber_quiz_dev}
    volumes:
      - cyber_quiz_pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cyber_quiz} -d ${POSTGRES_DB:-cyber_quiz}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  cyber_quiz_pgdata_dev:
