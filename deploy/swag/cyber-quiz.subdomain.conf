## Konfiguracja SWAG dla cyber_Quiz (subdomena)
##
## Instalacja na serwerze OCI:
## 1. Skopiuj ten plik do katalogu proxy-confs kontenera SWAG:
##      <swag_config>/nginx/proxy-confs/cyber-quiz.subdomain.conf
## 2. Zmień "quiz.*" poniżej, jeśli używasz innej subdomeny.
## 3. Upewnij się, że w konfiguracji SWAG subdomena jest objęta certyfikatem
##    (SUBDOMAINS=wildcard lub dodana do listy SUBDOMAINS) oraz że rekord DNS
##    A/CNAME dla tej subdomeny wskazuje na serwer OCI.
## 4. Przeładuj SWAG: docker restart swag

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    # Zmień "quiz.*" na swoją subdomenę, np. "cyberquiz.*"
    server_name quiz.*;

    include /config/nginx/ssl.conf;

    client_max_body_size 2m;

    # Opcjonalnie: odkomentuj poniższą sekcję, aby zabezpieczyć panel prowadzącego
    # i API edytora hasłem (plik .htpasswd generowany w SWAG).
    # Gracze na "/" oraz ekran gry "/game-screen" korzystają wyłącznie z WebSocketów
    # i NIE będą pytani o hasło.
    #
    # location ~ ^/(game-admin|api/) {
    #     auth_basic "Cyber Quiz Admin";
    #     auth_basic_user_file /config/nginx/.htpasswd;
    #
    #     include /config/nginx/proxy.conf;
    #     include /config/nginx/resolver.conf;
    #     set $upstream_app cyber-quiz;
    #     set $upstream_port 3001;
    #     set $upstream_proto http;
    #     proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    # }

    # Dedykowany blok dla Socket.IO (WebSocket + fallback polling, bez buforowania)
    location /socket.io/ {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;

        set $upstream_app cyber-quiz;
        set $upstream_port 3001;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Frontend SPA ("/", "/game-admin", "/game-screen") + REST API ("/api/*")
    location / {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;

        set $upstream_app cyber-quiz;
        set $upstream_port 3001;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }
}
